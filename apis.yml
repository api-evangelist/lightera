name: Lightera Networks
description: 'Lightera Networks Inc. was a Cupertino, California optical networking equipment startup
  backed by Kleiner Perkins. It built optical core switching systems for carrier transport networks
  during the late-1990s buildout of long-haul optical infrastructure. Ciena Corporation acquired Lightera
  Networks together with Marlborough, Massachusetts-based Omnia Communications Inc. for $980 million in
  stock in 1999, and the Lightera technology and team were absorbed into Ciena''s optical core switching
  line. The company no longer operates as an independent entity and never published a public API,
  developer portal, or machine-readable interface; this profile is retained as a historical record of
  the Kleiner Perkins portfolio and is not an active API provider. NOTE: unrelated to the present-day
  lightera.com, a rebrand of Furukawa Electric / OFS optical fiber manufacturing (see x-disambiguation).'
